name: WebGL headed Xvfb diagnostic

on:
  push:
    branches:
      - 'codex/threejs-webgl-swiftshader-diagnostic'

permissions:
  contents: read

jobs:
  compare:
    name: Headed WebGL unit diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare diagnostic receipts
        run: mkdir -p diagnostic-receipts
      - name: Install E2E graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb
          if [ -d /usr/share/vulkan/icd.d ]; then
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print -exec sha256sum {} \; | tee diagnostic-receipts/vulkan-icds.txt
          else
            printf 'No Vulkan ICD directory found\n' | tee diagnostic-receipts/vulkan-icds.txt
          fi
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 683672d6671cb3ae9dd9652b23b161a00b368ce5
          path: repo
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install dependencies
        working-directory: repo
        run: npm ci
      - name: Run focused, full unit, add-on, and coverage checks
        working-directory: repo
        run: |
          xvfb-run -a node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawn } from 'node:child_process';
          import { setTimeout as sleep } from 'node:timers/promises';
          import { createServer } from './utils/server.js';
          import puppeteer from 'puppeteer';

          const expectedHead = '683672d6671cb3ae9dd9652b23b161a00b368ce5';
          const expectedTest = 'Renderers > WebGLRenderer > updates instanced geometry when the shadow map is not updated';
          const baseArgs = [
            '--hide-scrollbars',
            '--enable-unsafe-webgpu',
            '--enable-features=Vulkan',
            '--disable-vulkan-surface',
            '--ignore-gpu-blocklist',
            '--disable-gpu-driver-bug-workarounds',
            '--no-sandbox'
          ];
          const driverPath = '/usr/share/vulkan/icd.d/lvp_icd.x86_64.json';
          const receiptsDir = path.resolve('../diagnostic-receipts');
          fs.mkdirSync(receiptsDir, { recursive: true });
          const sourceFiles = {
            '/test/unit/UnitTests.html': 'test/unit/UnitTests.html',
            '/test/unit/three.source.unit.js': 'test/unit/three.source.unit.js',
            '/test/unit/src/renderers/WebGLRenderer.tests.js': 'test/unit/src/renderers/WebGLRenderer.tests.js',
            '/src/renderers/WebGLRenderer.js': 'src/renderers/WebGLRenderer.js'
          };
          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const head = await new Promise((resolve, reject) => {
            const child = spawn('git', [ 'rev-parse', 'HEAD' ]);
            let out = '';
            child.stdout.on('data', data => out += data);
            child.on('error', reject);
            child.on('exit', code => code === 0 ? resolve(out.trim()) : reject(new Error('git rev-parse failed: ' + code)));
          });
          const sourceHashes = Object.fromEntries(Object.entries(sourceFiles).map(([urlPath, filePath]) => [urlPath, sha256(fs.readFileSync(filePath))]));
          const server = createServer({ root: process.cwd() });
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(0, '127.0.0.1', resolve); });
          const origin = 'http://127.0.0.1:' + server.address().port;
          const runStartedUtc = new Date().toISOString();
          const focusedProfile = fs.mkdtempSync(path.join(os.tmpdir(), 'three-headed-focused-'));
          const focused = {
            name: 'focused-headed',
            startedUtc: new Date().toISOString(),
            finishedUtc: null,
            sourceCommit: head,
            expectedSourceCommit: expectedHead,
            exactSourceCommit: head === expectedHead,
            runtime: {
              node: process.version,
              runnerOS: process.env.RUNNER_OS ?? null,
              runnerArchitecture: process.env.RUNNER_ARCH ?? null,
              kernel: os.release(),
              platform: os.platform(),
              architecture: os.arch(),
              display: process.env.DISPLAY ?? null,
              xvfb: Boolean(process.env.DISPLAY)
            },
            graphicsProvision: {
              mesaVulkanIcdExists: fs.existsSync(driverPath),
              VK_DRIVER_FILES: driverPath,
              chromiumHeadless: false,
              args: baseArgs
            },
            profile: { path: focusedProfile, newlyCreated: true },
            browserVersion: null,
            userAgent: null,
            gpuSystemInfo: null,
            gpuSystemInfoError: null,
            serviceWorkerBypass: true,
            cacheDisabled: true,
            serviceWorkerController: null,
            responses: [],
            requiredModules: {},
            webglContexts: [],
            qunit: null,
            pageErrors: [],
            consoleErrors: [],
            checks: {},
            error: null,
            pass: false
          };
          let browser;
          try {
            browser = await puppeteer.launch({
              headless: false,
              args: baseArgs,
              env: { ...process.env, VK_DRIVER_FILES: driverPath },
              defaultViewport: null,
              handleSIGINT: false,
              protocolTimeout: 0,
              userDataDir: focusedProfile
            });
            focused.browserVersion = await browser.version();
            const page = await browser.newPage();
            const pageClient = await page.createCDPSession();
            await pageClient.send('Network.enable');
            await pageClient.send('Network.setCacheDisabled', { cacheDisabled: true });
            await pageClient.send('Network.setBypassServiceWorker', { bypass: true });
            try {
              const browserClient = await browser.target().createCDPSession();
              focused.gpuSystemInfo = await browserClient.send('SystemInfo.getInfo');
            } catch (error) { focused.gpuSystemInfoError = String(error); }
            page.on('pageerror', error => focused.pageErrors.push(String(error)));
            page.on('console', message => { if (message.type() === 'error') focused.consoleErrors.push(message.text()); });
            const responseTasks = [];
            page.on('response', response => {
              const task = (async () => {
                const url = response.url();
                const parsed = new URL(url);
                const headers = response.headers();
                const record = {
                  url,
                  status: response.status(),
                  origin: parsed.origin,
                  path: parsed.pathname,
                  contentType: headers['content-type'] ?? '',
                  fromCache: typeof response.fromCache === 'function' ? response.fromCache() : null,
                  fromServiceWorker: typeof response.fromServiceWorker === 'function' ? response.fromServiceWorker() : null
                };
                if (record.contentType.includes('javascript') || record.contentType.includes('text/html') || Object.hasOwn(sourceFiles, parsed.pathname)) {
                  try { record.sha256 = sha256(await response.buffer()); }
                  catch (error) { record.bodyError = String(error); }
                }
                focused.responses.push(record);
              })().catch(error => focused.responses.push({ url: response.url(), handlerError: String(error) }));
              responseTasks.push(task);
            });
            await page.evaluateOnNewDocument(() => {
              window.__webglContexts = [];
              window.__unitObservedTests = [];
              window.__unitFailures = [];
              const originalGetContext = HTMLCanvasElement.prototype.getContext;
              HTMLCanvasElement.prototype.getContext = function (type, ...args) {
                const context = Reflect.apply(originalGetContext, this, [ type, ...args ]);
                if (context && /webgl/i.test(type)) {
                  const info = { requestedType: type };
                  try {
                    info.version = context.getParameter(context.VERSION);
                    info.vendor = context.getParameter(context.VENDOR);
                    info.renderer = context.getParameter(context.RENDERER);
                    const debug = context.getExtension('WEBGL_debug_renderer_info');
                    if (debug) {
                      info.unmaskedVendor = context.getParameter(debug.UNMASKED_VENDOR_WEBGL);
                      info.unmaskedRenderer = context.getParameter(debug.UNMASKED_RENDERER_WEBGL);
                    }
                  } catch (error) { info.error = String(error); }
                  window.__webglContexts.push(info);
                }
                return context;
              };
              const attach = () => {
                if (!window.QUnit || window.__unitQUnitAttached) return;
                window.__unitQUnitAttached = true;
                window.QUnit.on('testEnd', test => {
                  const entry = { name: test.fullName.join(' > '), status: test.status, passed: test.passed, failed: test.failed, skipped: test.skipped, todo: test.todo };
                  window.__unitObservedTests.push(entry);
                  if (test.status === 'failed') window.__unitFailures.push({ name: entry.name, messages: test.errors.map(error => error.message) });
                });
              };
              const timer = setInterval(() => { attach(); if (window.__unitQUnitAttached) clearInterval(timer); }, 1);
            });
            const testUrl = new URL('/test/unit/UnitTests.html', origin);
            testUrl.searchParams.set('filter', 'updates instanced geometry when the shadow map is not updated');
            focused.testUrl = testUrl.href;
            await page.goto(testUrl.href, { waitUntil: 'networkidle0', timeout: 300000 });
            await page.waitForFunction(() => window._QUnitStats !== undefined, { timeout: 300000 });
            await Promise.all(responseTasks);
            const state = await page.evaluate(() => ({
              stats: window._QUnitStats,
              observedTests: window.__unitObservedTests,
              failures: window.__unitFailures,
              webglContexts: window.__webglContexts,
              serviceWorkerController: navigator.serviceWorker?.controller != null
            }));
            focused.userAgent = await page.evaluate(() => navigator.userAgent);
            focused.serviceWorkerController = state.serviceWorkerController;
            focused.webglContexts = state.webglContexts;
            focused.qunit = { stats: state.stats, observedTests: state.observedTests, failures: state.failures };
            const moduleChecks = {};
            for (const [urlPath, filePath] of Object.entries(sourceFiles)) {
              const served = focused.responses.find(record => record.origin === origin && record.path === urlPath);
              moduleChecks[urlPath] = {
                expectedFile: filePath,
                expectedSha256: sourceHashes[urlPath],
                status: served?.status ?? null,
                servedSha256: served?.sha256 ?? null,
                fromCache: served?.fromCache ?? null,
                fromServiceWorker: served?.fromServiceWorker ?? null,
                pass: Boolean(served && served.status === 200 && served.sha256 === sourceHashes[urlPath] && served.fromCache === false && served.fromServiceWorker === false)
              };
            }
            focused.requiredModules = moduleChecks;
            const qunitPass = Boolean(state.stats?.total === 1 && state.stats?.passed === 1 && state.stats?.failed === 0 && state.observedTests.length === 1 && state.observedTests[0].name === expectedTest && state.observedTests[0].status === 'passed');
            focused.checks = {
              exactCheckout: focused.exactSourceCommit,
              displayAvailable: Boolean(focused.runtime.display),
              mesaVulkanIcdAvailable: focused.graphicsProvision.mesaVulkanIcdExists,
              filteredPixelAssertionPassed: qunitPass,
              requiredModulesFreshAndMatching: Object.values(moduleChecks).every(check => check.pass),
              actualWebglContextCreated: state.webglContexts.length > 0,
              noServiceWorkerController: state.serviceWorkerController === false,
              browserAndGpuInfoCaptured: Boolean(focused.browserVersion && focused.userAgent && (focused.gpuSystemInfo || focused.gpuSystemInfoError)),
              pageErrorsAbsent: focused.pageErrors.length === 0
            };
            focused.pass = Object.values(focused.checks).every(Boolean);
          } catch (error) { focused.error = String(error?.stack ?? error); }
          finally {
            if (browser) { try { await browser.close(); } catch {} }
            focused.finishedUtc = new Date().toISOString();
            fs.writeFileSync(path.join(receiptsDir, 'focused-headed.json'), JSON.stringify(focused, null, 2));
            await new Promise(resolve => server.close(resolve));
          }
          console.log('Focused headed result: ' + (focused.pass ? 'PASS' : 'FAIL'));
          const results = { focused, fullUnit: null, addons: null, coverage: null };

          async function captureCommand(name, args) {
            const startedUtc = new Date().toISOString();
            const logPath = path.join(receiptsDir, name + '.log');
            const log = fs.createWriteStream(logPath);
            const child = spawn(name === 'full-unit' ? 'npm' : 'npm', args, {
              cwd: process.cwd(),
              env: { ...process.env, VK_DRIVER_FILES: driverPath },
              stdio: [ 'ignore', 'pipe', 'pipe' ]
            });
            child.stdout.on('data', chunk => { log.write(chunk); process.stdout.write(chunk); });
            child.stderr.on('data', chunk => { log.write(chunk); process.stderr.write(chunk); });
            const exit = await new Promise(resolve => {
              child.once('error', error => resolve({ code: null, signal: null, error: String(error) }));
              child.once('exit', (code, signal) => resolve({ code, signal, error: null }));
            });
            await new Promise(resolve => log.end(resolve));
            return { name, command: 'npm ' + args.join(' '), startedUtc, finishedUtc: new Date().toISOString(), logPath, ...exit };
          }

          async function runFullHeadful() {
            const name = 'full-unit';
            const startedUtc = new Date().toISOString();
            const profile = path.resolve('.puppeteer_profile');
            const receipt = {
              name,
              command: 'npm run test-unit-headful',
              startedUtc,
              freshProfilePath: profile,
              freshProfileWasAbsent: !fs.existsSync(profile),
              headedDisplay: process.env.DISPLAY ?? null,
              runnerFlags: baseArgs,
              VK_DRIVER_FILES: driverPath,
              browserVersion: null,
              userAgent: null,
              pageUrl: null,
              qunit: null,
              sidecarError: null,
              runnerExitCode: null,
              runnerSignal: null,
              pass: false
            };
            if (fs.existsSync(profile)) {
              receipt.sidecarError = 'Fresh checkout unexpectedly contained .puppeteer_profile; refusing to reuse or delete it.';
              receipt.finishedUtc = new Date().toISOString();
              return receipt;
            }
            const logPath = path.join(receiptsDir, 'full-unit.log');
            const log = fs.createWriteStream(logPath);
            receipt.logPath = logPath;
            const child = spawn('npm', [ 'run', 'test-unit-headful' ], {
              cwd: process.cwd(),
              env: { ...process.env, VK_DRIVER_FILES: driverPath },
              stdio: [ 'ignore', 'pipe', 'pipe' ]
            });
            child.stdout.on('data', chunk => { log.write(chunk); process.stdout.write(chunk); });
            child.stderr.on('data', chunk => { log.write(chunk); process.stderr.write(chunk); });
            let connected;
            let testPage;
            let statsSeen = false;
            try {
              const activePortFile = path.join(profile, 'DevToolsActivePort');
              let endpoint;
              const launchDeadline = Date.now() + 60000;
              while (!endpoint && Date.now() < launchDeadline && child.exitCode === null) {
                if (fs.existsSync(activePortFile)) {
                  const lines = fs.readFileSync(activePortFile, 'utf8').trim().split('\n');
                  if (Number(lines[0]) > 0) endpoint = 'http://127.0.0.1:' + lines[0];
                }
                if (!endpoint) await sleep(100);
              }
              if (!endpoint) throw new Error('The existing headful runner did not publish its DevTools port before exit/timeout.');
              const connectDeadline = Date.now() + 30000;
              while (!connected && Date.now() < connectDeadline && child.exitCode === null) {
                try { connected = await puppeteer.connect({ browserURL: endpoint }); }
                catch { await sleep(250); }
              }
              if (!connected) throw new Error('Could not attach the read-only QUnit observer to the launched Chrome process.');
              const pageDeadline = Date.now() + 60000;
              while (!testPage && Date.now() < pageDeadline && child.exitCode === null) {
                const pages = await connected.pages();
                testPage = pages.find(page => page.url().includes('/test/unit/UnitTests.html')) ?? null;
                if (!testPage) await sleep(200);
              }
              if (!testPage) throw new Error('The existing headful runner did not navigate to the unit page.');
              receipt.browserVersion = await connected.version();
              receipt.pageUrl = testPage.url();
              receipt.userAgent = await testPage.evaluate(() => navigator.userAgent);
              await testPage.waitForFunction(() => window._QUnitStats !== undefined, { timeout: 25 * 60 * 1000 });
              const state = await testPage.evaluate(() => ({ stats: window._QUnitStats, failures: window._QUnitFailures ?? [] }));
              receipt.qunit = state;
              statsSeen = true;
              await testPage.close();
              testPage = null;
              const exit = await new Promise(resolve => {
                if (child.exitCode !== null) return resolve({ code: child.exitCode, signal: child.signalCode });
                const timer = setTimeout(() => resolve({ code: null, signal: 'close-timeout' }), 30000);
                child.once('exit', (code, signal) => { clearTimeout(timer); resolve({ code, signal }); });
              });
              receipt.runnerExitCode = exit.code;
              receipt.runnerSignal = exit.signal;
              receipt.pass = Boolean(state.stats?.total > 0 && state.stats?.failed === 0 && exit.code === 0);
            } catch (error) {
              receipt.sidecarError = String(error?.stack ?? error);
              if (testPage) { try { await testPage.close(); } catch {} }
              if (child.exitCode === null) {
                child.kill('SIGINT');
                await new Promise(resolve => child.once('exit', () => resolve()));
              }
            } finally {
              if (connected) connected.disconnect();
              await new Promise(resolve => log.end(resolve));
              receipt.finishedUtc = new Date().toISOString();
            }
            if (!statsSeen && child.exitCode !== null) receipt.runnerExitCode = child.exitCode;
            return receipt;
          }

          if (focused.pass) {
            results.fullUnit = await runFullHeadful();
            fs.writeFileSync(path.join(receiptsDir, 'full-unit.json'), JSON.stringify(results.fullUnit, null, 2));
            results.addons = await captureCommand('addons', [ 'run', 'test-unit-addons' ]);
            fs.writeFileSync(path.join(receiptsDir, 'addons.json'), JSON.stringify(results.addons, null, 2));
            results.coverage = await captureCommand('coverage', [ 'run', 'test-e2e-cov' ]);
            fs.writeFileSync(path.join(receiptsDir, 'coverage.json'), JSON.stringify(results.coverage, null, 2));
          } else {
            console.log('Full unit, add-on, and coverage checks were not run because the focused headed regression check did not pass.');
          }

          await new Promise(resolve => server.close(resolve));
          const report = {
            diagnostic: 'PR #35100 headed Xvfb browser qualification',
            startedUtc: runStartedUtc,
            finishedUtc: new Date().toISOString(),
            sourceCommit: head,
            expectedSourceCommit: expectedHead,
            runner: { node: process.version, os: os.release(), platform: os.platform(), architecture: os.arch(), display: process.env.DISPLAY ?? null, mesaVulkanIcd: fs.existsSync(driverPath), VK_DRIVER_FILES: driverPath },
            results
          };
          fs.writeFileSync(path.join(receiptsDir, 'comparison.json'), JSON.stringify(report, null, 2));
          const fullPass = results.fullUnit?.pass === true;
          const addonsPass = results.addons?.code === 0;
          const coveragePass = results.coverage?.code === 0;
          const summary = [
            '# Headed Xvfb diagnostic',
            '',
            '- Source commit exact: ' + String(head === expectedHead),
            '- Focused headed WebGL assertion: ' + (focused.pass ? 'PASS' : 'FAIL'),
            '- Existing full test-unit-headful entry: ' + (results.fullUnit ? (fullPass ? 'PASS' : 'FAIL') : 'NOT RUN'),
            '- Existing test-unit-addons entry: ' + (results.addons ? (addonsPass ? 'PASS' : 'FAIL') : 'NOT RUN'),
            '- Existing test-e2e-cov entry: ' + (results.coverage ? (coveragePass ? 'PASS' : 'FAIL') : 'NOT RUN'),
            '- Timestamp: ' + new Date().toISOString()
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          const pass = focused.pass && fullPass && addonsPass && coveragePass;
          if (!pass) process.exitCode = 1;
          NODE
      - name: Upload diagnostic receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webgl-headed-xvfb-diagnostic
          path: diagnostic-receipts/
          if-no-files-found: warn
